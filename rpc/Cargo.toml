[package]
name = "rpc"
version = "0.1.0"
edition = "2024"
[dependencies]
arrayvec = "0.7.8"
bytes = "1.11.1"
futures = { version = "0.3.32", features = ["alloc", "std"] }
futures-io = "0.3.32"
maxlen = { version = "0.1.0", path = "../maxlen" }
minicbor = { version = "2.2.1", features = ["std", "derive"] }
minicbor-io = { version = "0.23.0", features = ["async-io"] }
quinn = { version = "0.11.9", default-features = false, optional = true, features = ["futures-io"] }
rustls = {version = "0.23.43", optional = true, default-features = false}
thiserror = "2.0.18"
tokio = { version = "1.50.0", default-features = false }
tracing = "0.1.44"




[features]
default = ["quinn"]
quinn = ["dep:quinn", "dep:rustls"]

[dev-dependencies]
test-log = { version = "0.2.20", default-features = false, features = ["color", "trace"] }
anyhow = "1.0.102"
derive_more = { version = "2.1.1", features = ["from", "try_into"] }
hegeltest = "0.28.6"
minicbor-derive = "0.19.3"
quic-rpc = "0.20.0"
serde = "1.0.228"
tokio = { version = "1.50.0", features = ["test-util", "time", "rt-multi-thread"] }
max-sized-string = {version = "0.1.0", path = "../max-sized-string"}
tracing-subscriber = "0.3.23"
max-sized-vec = { path = "../max-sized-vec" }

[[example]]
name = "room"
path = "examples/room/main.rs"
doc-scrape-examples = true
