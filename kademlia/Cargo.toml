[package]
name = "kademlia"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
arrayvec = "0.7.6"
futures = "0.3.31"
maxlen = { version = "0.1.0", path = "../maxlen", optional = true }
minicbor = { version = "2.1.3", features = [
    "alloc",
    "std",
    "derive",
], optional = true }
rand = "0.9.2"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["sync"] }
tracing = "0.1.41"


[dev-dependencies]
sha2 = { version = "0.10.9", features = ["asm", "asm-aarch64"] }
expect-test = "1.5.1"
rand = "0.9.2"
rand_distr = "0.5.1"
tokio = { version = "1.47.1", features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "fs",
] }
tokio-stream = { version = "0.1.17", features = ["fs"] }
tracing-test = "0.2.5"
serde = "1.0.229"
postcard = { version = "1.1.3", features = ["use-std"] }

[features]
minicbor = ["dep:minicbor"]
maxlen = ["dep:maxlen", "minicbor"]
